#cloud-config
package_update: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - openvpn
  - openssl
  - build-essential
  - make
  - cmake
  - git
  - g++
  - gh
  - ffmpeg
  - python3
  - python3-openai
  - python3-pip

users:
  - default

write_files:
  # OpenVPN bootstrap script (values rendered in by Terraform)
  - path: /opt/openvpn-setup.sh
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      cd /etc/openvpn/server

      # skip if already provisioned
      if [ -f ${project_name}.ovpn.done ]; then exit 0; fi

      # server identity
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:secp384r1 \
        -keyout server.key -out server.crt -nodes -sha256 -days 3650 \
        -subj '/CN=${vm_common_name}'
      chmod 600 server.key

      # client identity
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:secp384r1 \
        -keyout client.key -out client.crt -nodes -sha256 -days 3650 \
        -subj '/CN=${vm_common_name}-client'

      fp() { openssl x509 -fingerprint -sha256 -noout -in "$1" | cut -d= -f2; }

      # server config
      cat > server.conf <<EOF
      port ${openvpn_port}
      proto udp
      dev tun
      cert /etc/openvpn/server/server.crt
      key /etc/openvpn/server/server.key
      dh none
      server 10.8.0.0 255.255.255.0
      push "route ${vm_private_ip} 255.255.255.255"
      tun-mtu 1400
      <peer-fingerprint>
      $(fp client.crt)
      </peer-fingerprint>
      explicit-exit-notify 1
      keepalive 60 300
      persist-key
      persist-tun
      user nobody
      group nogroup
      verb 3
      EOF

      # client profile
      cat > /home/${admin_username}/${project_name}.ovpn <<EOF
      # OpenVPN client profile for ${vm_common_name}
      client
      remote ${openvpn_public_ip} ${openvpn_port}
      proto udp
      dev tun
      nobind
      persist-key
      persist-tun
      tun-mtu 1400
      verb 3
      <key>
      $(cat client.key)
      </key>
      <cert>
      $(cat client.crt)
      </cert>
      peer-fingerprint $(fp server.crt)
      EOF
      chown ${admin_username} /home/${admin_username}/${project_name}.ovpn
      chmod 600 /home/${admin_username}/${project_name}.ovpn

      touch ${project_name}.ovpn.done
      systemctl enable --now openvpn-server@server

runcmd:
  # apt update
  - apt update && apt upgrade -y
  # Node.js 26 - OpenClaw recommended runtime
  - curl -fsSL https://deb.nodesource.com/setup_26.x | bash -
  - apt install -y nodejs
  - node --version  # Azure-CLI (az)
  - sudo mkdir -p /etc/apt/keyrings
  - curl -sL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /etc/apt/keyrings/microsoft.gpg > /dev/null
  - AZ_DIST=$(lsb_release -cs)
  - echo "deb [arch=amd64,arm64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ $AZ_DIST main" | tee /etc/apt/sources.list.d/azure-cli.list
  - apt update && apt install -y azure-cli
  # full system update/upgrade before provisioning
  - apt update && apt upgrade -y
  # Claude Code
  - runuser -l ${admin_username} -c 'curl -fsSL https://claude.ai/install.sh | bash -s stable'
  # Codex
  - runuser -l ${admin_username} -c 'curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh'
  # Antigravity
  - runuser -l ${admin_username} -c 'curl -fsSL https://antigravity.google/cli/install.sh | bash'
  # Github Copilot
  - runuser -l ${admin_username} -c 'curl -fsSL https://gh.io/copilot-install | bash'
  # OpenClaw
  - runuser -l ${admin_username} -c 'curl -fsSL https://openclaw.ai/install.sh | bash -s -- --no-prompt --no-onboard'
  # Hermes
  # - runuser -l ${admin_username} -c 'curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive'
  # ensure user-local CLI path
  - runuser -l ${admin_username} -c 'grep -qxF '\''export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"'\'' ~/.bashrc || echo '\''export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"'\'' >> ~/.bashrc'
  # git clone repo local
  - runuser -l ${admin_username} -c 'mkdir -p ~/WORK/CODE/REPO && pushd ~/WORK/CODE/REPO && git clone https://github.com/bentman/BentClaw.git && popd'
  # run OpenVPN setup script
  - bash /opt/openvpn-setup.sh
