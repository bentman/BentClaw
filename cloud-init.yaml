#cloud-config
# Bootstrap OpenClaw on first boot (official installer script)
package_update: true
packages:
  - apt-transport-https
  - ca-certificates
  - openvpn
  - openssl
  - curl
  - build-essential
  - make
  - cmake
  - git
  - g++
  - gh
  - gnupg
  - ffmpeg
  - python3
  - python3-openai
  - python3-pip

users:
  - default

write_files:
  # OpenVPN bootstrap script (values rendered in by Terraform)
  - path: /opt/openvpn-setup.sh
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      cd /etc/openvpn/server

      # skip if already provisioned
      if [ -f azureclaw.ovpn.done ]; then exit 0; fi

      # server identity
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:secp384r1 \
        -keyout server.key -out server.crt -nodes -sha256 -days 3650 \
        -subj '/CN=${vm_common_name}'
      chmod 600 server.key

      # client identity
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:secp384r1 \
        -keyout client.key -out client.crt -nodes -sha256 -days 3650 \
        -subj '/CN=${vm_common_name}-client'

      fp() { openssl x509 -fingerprint -sha256 -noout -in "$1" | cut -d= -f2; }

      # server config
      cat > server.conf <<EOF
      port ${openvpn_port}
      proto udp
      dev tun
      cert /etc/openvpn/server/server.crt
      key /etc/openvpn/server/server.key
      dh none
      server 10.8.0.0 255.255.255.0
      push "route ${vm_private_ip} 255.255.255.255"
      tun-mtu 1400
      <peer-fingerprint>
      $(fp client.crt)
      </peer-fingerprint>
      explicit-exit-notify 1
      keepalive 60 300
      persist-key
      persist-tun
      user nobody
      group nogroup
      verb 3
      EOF

      # client profile
      cat > /home/${admin_username}/azureclaw.ovpn <<EOF
      # OpenVPN client profile for ${vm_common_name}
      client
      remote ${openvpn_public_ip} ${openvpn_port}
      proto udp
      dev tun
      nobind
      persist-key
      persist-tun
      tun-mtu 1400
      verb 3
      <key>
      $(cat client.key)
      </key>
      <cert>
      $(cat client.crt)
      </cert>
      peer-fingerprint $(fp server.crt)
      EOF
      chown ${admin_username} /home/${admin_username}/azureclaw.ovpn
      chmod 600 /home/${admin_username}/azureclaw.ovpn

      touch azureclaw.ovpn.done
      systemctl enable --now openvpn-server@server
  - path: /opt/install-user-ai-tools.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      ADMIN_USER="${admin_username}"
      ADMIN_HOME="/home/${admin_username}"

      run_as_admin() {
        sudo -Hiu "$ADMIN_USER" bash -lc "$1"
      }

      echo "== installing Claude Code for $ADMIN_USER =="
      run_as_admin '
        set -e
        export PATH="$HOME/.local/bin:$PATH"
        curl -fsSL https://claude.ai/install.sh \
          | bash -s stable >/tmp/claude-code-install.log 2>&1
        command -v claude
        claude --version
      '

      echo "== installing Codex for $ADMIN_USER =="
      run_as_admin '
        set -e
        export PATH="$HOME/.local/bin:$PATH"
        curl -fsSL https://chatgpt.com/codex/install.sh \
          | CODEX_NON_INTERACTIVE=1 sh >/tmp/codex-install.log 2>&1
        command -v codex
        codex --version
      '

      echo "== installing OpenClaw for $ADMIN_USER =="
      run_as_admin '
        set -e
        export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
        curl -fsSL --proto "=https" --tlsv1.2 https://openclaw.ai/install.sh \
          | bash -s -- --no-prompt --no-onboard >/tmp/openclaw-install.log 2>&1
        command -v openclaw
        openclaw --version
      '

      echo "== ensuring PATH in bashrc =="
      run_as_admin '
        grep -qxF '\''export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"'\'' ~/.bashrc \
          || echo '\''export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"'\'' >> ~/.bashrc
      '

runcmd:
  # full system update/upgrade before provisioning
  - apt update && apt upgrade -y

  # azure-cli is not in the Ubuntu 24.04 archive; install from packages.microsoft.com
  - install -d -m 0755 /etc/apt/keyrings
  - curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/keyrings/microsoft.gpg
  - echo "deb [arch=amd64,arm64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ noble main" | tee /etc/apt/sources.list.d/azure-cli.list
  - apt update && apt install -y azure-cli

  # install user-scoped Claude Code, Codex, and OpenClaw
  - bash /opt/install-user-ai-tools.sh

  # bootstrap OpenVPN
  - bash /opt/openvpn-setup.sh